name: Apply Contract Safety Patch

on:
  push:
    branches:
      - fix/contract-safety-gate-2026-08-22

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contract-safety-gate-2026-08-22
      - name: Wire contract safety gate into screening and money execution
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'patch anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/pipeline/orchestrator.js',
              "import { evaluateMarketAllocator, allocationAllowsCandidate } from '../execution/marketAllocator.js';\n",
              "import { evaluateMarketAllocator, allocationAllowsCandidate } from '../execution/marketAllocator.js';\nimport { applyContractSafetyGate } from '../execution/contractSafetyGate.js';\n",
          )
          replace_once(
              'src/pipeline/orchestrator.js',
              "  let candidate = await buildCandidate(signals);\n  const signature = signals.signature || null;\n",
              "  let candidate = await buildCandidate(signals);\n  const moneyMode = tradingMode() !== 'dry_run';\n  await applyContractSafetyGate(candidate, {\n    moneyMode,\n    stage: 'screening',\n    fetchRugcheck: moneyMode,\n  });\n  const signature = signals.signature || null;\n",
          )

          replace_once(
              'src/execution/router.js',
              "import { assertLossStreakAllowed } from './riskControls.js';\n",
              "import { assertLossStreakAllowed } from './riskControls.js';\nimport { assertContractSafetyForMoneyMode } from './contractSafetyGate.js';\n",
          )
          replace_once(
              'src/execution/router.js',
              "  assertSafeLiveDecision(decision, strat);\n  const blocked = liveEntryBlockReason(candidate.token.mint, strat);\n",
              "  assertSafeLiveDecision(decision, strat);\n  await assertContractSafetyForMoneyMode(candidate, { stage: 'pre_execution' });\n  const blocked = liveEntryBlockReason(candidate.token.mint, strat);\n",
          )
          replace_once(
              'src/execution/router.js',
              "    const strat = activeStrategy();\n    assertSafeLiveDecision(decision, strat);\n",
              "    await assertContractSafetyForMoneyMode(freshRow.candidate, { stage: 'pre_execution' });\n    const strat = activeStrategy();\n    assertSafeLiveDecision(decision, strat);\n",
          )
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pipeline/orchestrator.js src/execution/router.js
          git commit -m 'fix: enforce contract safety before money entries'
          git push origin HEAD:fix/contract-safety-gate-2026-08-22
