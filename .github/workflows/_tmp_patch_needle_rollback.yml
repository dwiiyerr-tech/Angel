name: Temporary Needle Rollback Patch

on:
  push:
    branches:
      - feat/needle-self-calibration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/needle-self-calibration

      - name: Apply guarded patch
        run: python3 scripts/_tmp_patch_needle_rollback.py

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore absent settings on control-plane rollback"
          git push origin HEAD:feat/needle-self-calibration
