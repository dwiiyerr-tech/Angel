name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/jupiter-simulation-guard]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Use stable npm 11
        run: npm install --global npm@11.19.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Prepare dependency graph
        run: |
          npm config set registry https://registry.npmjs.org/
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: npm run check
