name: Angel CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'

permissions:
  contents: read

concurrency:
  group: angel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node 22 lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static parse and unit tests
        run: npm run check

      - name: Research report smoke test
        env:
          DB_PATH: /tmp/angel-research-report.sqlite
        run: npm run research:report

      - name: Runner and route edge report smoke test
        env:
          DB_PATH: /tmp/angel-edge-report.sqlite
        run: npm run edge:report

      - name: Strategy control-plane report smoke test
        env:
          DB_PATH: /tmp/angel-control-plane-report.sqlite
        run: npm run control:report

      - name: Fast Hunter latency report smoke test
        env:
          DB_PATH: /tmp/angel-fast-hunter-report.sqlite
        run: npm run fast:report

      - name: Live safety chaos report smoke test
        env:
          DB_PATH: /tmp/angel-live-chaos-report.sqlite
        run: npm run chaos:report

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src scripts -type f -name '*.py' -print)
          if [ "${#files[@]}" -gt 0 ]; then
            python -m py_compile "${files[@]}"
          fi
