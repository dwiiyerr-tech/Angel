name: Dependency Lock Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Use stable npm 11
        run: npm install --global npm@11.19.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Regenerate package lock from official registry
        run: |
          npm config set registry https://registry.npmjs.org/
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore: regenerate package lock from npm registry"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Clean install
        run: npm ci

      - name: Lint and unit tests
        run: npm run check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures
