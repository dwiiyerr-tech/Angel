name: Dependency Security CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use stable npm 11
        run: npm install --global npm@11.19.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Clean install from committed lockfile
        run: npm ci

      - name: Lint and unit tests
        run: npm run check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures
