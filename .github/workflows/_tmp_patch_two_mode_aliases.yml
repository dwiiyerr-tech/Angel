name: Temporary Two-Mode Alias Patch

on:
  push:
    branches:
      - fix/canonical-two-mode-capital-paths

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded canonical-mode replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          positions = Path('src/db/positions.js')
          text = positions.read_text()
          old = "coalesce(execution_mode, 'dry_run') != 'research'"
          new = "lower(trim(coalesce(execution_mode, 'dry_run'))) IN ('live', 'confirm')"
          count = text.count(old)
          if count != 7:
              raise SystemExit(f'expected 7 legacy capital predicates in {positions}, found {count}')
          positions.write_text(text.replace(old, new))

          engine = Path('src/research/engine.js')
          text = engine.read_text()
          old_block = """    SELECT COUNT(*) AS count\n    FROM dry_run_positions\n    WHERE execution_mode = 'research' AND status = 'open'\n"""
          new_block = """    SELECT COUNT(*) AS count\n    FROM dry_run_positions\n    WHERE status = 'open'\n      AND lower(trim(coalesce(execution_mode, 'dry_run'))) NOT IN ('live', 'confirm')\n"""
          count = text.count(old_block)
          if count != 1:
              raise SystemExit(f'expected one PAPER capacity predicate in {engine}, found {count}')
          engine.write_text(text.replace(old_block, new_block))
          PY
      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet -- src/db/positions.js src/research/engine.js; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/positions.js src/research/engine.js
          git commit -m "fix: canonicalize capital mode predicates"
          git push origin HEAD:fix/canonical-two-mode-capital-paths
